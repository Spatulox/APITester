name: Release

# Pousser un tag vX.Y.Z_alpha, vX.Y.Z_beta, vX.Y.Z_rc ou vX.Y.Z_release (ou vX.Y.Z) :
#   1. release-kit décode le tag,
#   2. build.yml construit les paquets avec PackagingOnLinux (packaging.toml) :
#      .deb par version d'Ubuntu, .rpm, .tar.gz (amd64 + arm64), installeur
#      Windows et zip portable,
#   3. release-kit crée la release GitHub avec la section du CHANGELOG.md.
# Voir https://github.com/Spatulox/release-kit
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tag:
    uses: Spatulox/release-kit/.github/workflows/tag.yml@v1

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      debversion: ${{ needs.tag.outputs.debversion }}

  publish:
    needs: [tag, build]
    uses: Spatulox/release-kit/.github/workflows/publish.yml@v1
    with:
      tag: ${{ needs.tag.outputs.tag }}
      prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
      title: APITester ${{ needs.tag.outputs.tag }}
