name: Build

# CI de build propre à APITester, appelée par release.yml une fois le tag décodé
# par release-kit. Tous les paquets sont construits par le workflow réutilisable de
# PackagingOnLinux (package.yml) d'après packaging.toml, dans l'image de build
# .github/build.Dockerfile (Go, Node, Wails, WebKitGTK), avec la version du tag :
#   - .deb amd64 et arm64, un par version d'Ubuntu (input "ubuntu"),
#   - .tar.gz amd64 et arm64, construits sur la plus ancienne,
#   - .rpm amd64 et aarch64, construits sur Fedora (input "fedora"),
#   - Windows : installeur NSIS + zip portable amd64, cross-compilés depuis Linux.
# Les livrables sont uploadés dans des artifacts "release-*", que release-kit
# joint à la release GitHub.
on:
  workflow_call:
    inputs:
      debversion:   # 1.2.0~beta
        type: string
        required: true
      ubuntu:
        # Une nouvelle Ubuntu = une entrée de plus ici (ex. "28.04"), rien d'autre.
        # La première (la plus ancienne) produit aussi le .tar.gz et les paquets Windows.
        description: Versions d'Ubuntu pour lesquelles produire un .deb (liste JSON)
        type: string
        default: '["24.04", "26.04"]'
      fedora:
        # Plus ancienne Fedora maintenue : le .rpm demande la glibc de cette version.
        description: Version de Fedora sur laquelle construire le .rpm
        type: string
        default: '44'

jobs:
  # Les Depends détectés (dpkg-shlibdeps) sont ceux de cette Ubuntu.
  deb:
    name: deb (ubuntu ${{ matrix.ubuntu }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ${{ fromJSON(inputs.ubuntu) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: Spatulox/PackagingOnLinux/.github/workflows/package.yml@main
    with:
      formats: deb
      # 1.2.0~beta+ubuntu26.04 > 1.2.0~beta+ubuntu24.04 : apt met le paquet à
      # jour proprement après une montée de version de l'OS.
      version: ${{ inputs.debversion }}+ubuntu${{ matrix.ubuntu }}
      dockerfile: .github/build.Dockerfile
      build-args: BASE=ubuntu:${{ matrix.ubuntu }}
      runs-on: ${{ matrix.runner }}
      artifact-name: release-linux-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}

  # Sur la plus ancienne Ubuntu (glibc la plus ancienne), sans le suffixe +ubuntuXX.XX.
  tarball:
    name: tar.gz (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: Spatulox/PackagingOnLinux/.github/workflows/package.yml@main
    with:
      formats: tarball
      version: ${{ inputs.debversion }}
      dockerfile: .github/build.Dockerfile
      build-args: BASE=ubuntu:${{ fromJSON(inputs.ubuntu)[0] }}
      runs-on: ${{ matrix.runner }}
      artifact-name: release-linux-tarball-${{ matrix.arch }}

  # Requires détectés depuis le binaire (rpm AutoReq).
  rpm:
    name: rpm (fedora ${{ inputs.fedora }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: Spatulox/PackagingOnLinux/.github/workflows/package.yml@main
    with:
      formats: rpm
      version: ${{ inputs.debversion }}
      dockerfile: .github/build.Dockerfile
      build-args: BASE=fedora:${{ inputs.fedora }}
      runs-on: ${{ matrix.runner }}
      artifact-name: release-linux-fedora-${{ matrix.arch }}

  # Wails cross-compile l'exe Windows depuis Linux (WebView2, sans cgo), et
  # PackagingOnLinux construit l'installeur avec makensis.
  windows:
    uses: Spatulox/PackagingOnLinux/.github/workflows/package.yml@main
    with:
      formats: zip,nsis
      version: ${{ inputs.debversion }}
      dockerfile: .github/build.Dockerfile
      build-args: BASE=ubuntu:${{ fromJSON(inputs.ubuntu)[0] }}
      artifact-name: release-windows
